[workspace]
resolver = "2"
members = [
    "crates/prin-dynamics",
    "crates/prin-metrics",
    "crates/prin-tensor",
    "crates/prin-kernels",
    "crates/prin-sim",
    "crates/prin-train",
    "crates/prin-daemon",
    "crates/prin-py",
]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = [
    "Michael Maillet <therealmichaelmaillet@gmail.com>",
    "Damien Davison",
    "Sacha Davison",
]
repository = "https://github.com/Symbo-gif/PRIN"
description = "PRIN — Phase-Resonance Interference Network (Rust core)"

[workspace.dependencies]
# Intra-workspace crates
prin-dynamics = { path = "crates/prin-dynamics" }
prin-metrics = { path = "crates/prin-metrics" }
prin-tensor = { path = "crates/prin-tensor" }
prin-kernels = { path = "crates/prin-kernels" }
prin-sim = { path = "crates/prin-sim" }
prin-train = { path = "crates/prin-train" }
prin-daemon = { path = "crates/prin-daemon" }

# Numerics
ndarray = { version = "0.16", features = ["serde"] }
faer = "0.20"
sprs = "0.11"
rayon = "1.10"
num-complex = "0.4"
rand = "0.8"
rand_pcg = "0.3"
# FFT for prin-metrics power spectral density (pure Rust, no unsafe at the
# public API boundary; added in WP-010 S1 for the PSD rebuild of PRINet 3.0
# `power_spectral_density`).
rustfft = "6.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DLPack C ABI for zero-copy tensor exchange (PyTorch / JAX / CuPy)
dlpack = "0.2.0"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Cryptographic hashing for model-artefact integrity verification
# (WP-028: `prin-daemon` verifies the subconscious controller's SHA-256
# manifest before an ONNX session is created). Already present in the
# lock file as a transitive dependency; promoted to a direct workspace
# dependency here.
sha2 = "0.10"

# Lock-free, wait-free-read "latest value" cell (WP-029: `prin-daemon`'s
# `ControlSignalBuffer`, replacing PRINet 3.0's `threading.Lock`-guarded
# buffer). `ArcSwap` is a widely audited, MSRV-friendly primitive (used by
# hyper/tokio-adjacent crates); its safe public API keeps `prin-daemon` under
# `#![forbid(unsafe_code)]` — the atomic-pointer/hazard-pointer bookkeeping
# that makes a hand-rolled equivalent correct lives inside the dependency,
# not in first-party code.
arc-swap = "1.7"

# Testing
proptest = "1"
approx = "0.5"
criterion = "0.5"
# Scratch directories for filesystem-touching unit tests (dev-only).
tempfile = "3"

# GPU compute language (CubeCL) — Phase 0 spike; runtime selected via crate features.
cubecl = { version = "0.10.0", default-features = false, features = ["std"] }

# Autodiff/training backend (Burn) — Phase 4 trainable stack (WP-022). `ndarray`
# is the CPU reference backend; `autodiff` wraps it for gradient computation.
# GPU-backed Burn backends (wgpu/cuda) are deferred to the Torch-bridge work
# (WP-025) per Project Plan §4.3 risk register #5.
burn = { version = "0.16", default-features = false, features = ["std", "ndarray", "autodiff"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
