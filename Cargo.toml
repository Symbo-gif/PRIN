[workspace]
resolver = "2"
members = [
    "crates/prin-dynamics",
    "crates/prin-metrics",
    "crates/prin-tensor",
    "crates/prin-kernels",
    "crates/prin-sim",
    "crates/prin-train",
    "crates/prin-daemon",
    "crates/prin-py",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = [
    "Michael Maillet <therealmichaelmaillet@gmail.com>",
    "Damien Davison",
    "Sacha Davison",
]
repository = "https://github.com/Symbo-gif/PRIN"
description = "PRIN — Phase-Resonance Interference Network (Rust core)"

[workspace.dependencies]
# Intra-workspace crates
prin-dynamics = { path = "crates/prin-dynamics" }
prin-metrics = { path = "crates/prin-metrics" }
prin-tensor = { path = "crates/prin-tensor" }
prin-kernels = { path = "crates/prin-kernels" }
prin-sim = { path = "crates/prin-sim" }
prin-train = { path = "crates/prin-train" }
prin-daemon = { path = "crates/prin-daemon" }

# Numerics
ndarray = { version = "0.16", features = ["serde"] }
faer = "0.20"
sprs = "0.11"
rayon = "1.10"
num-complex = "0.4"
rand = "0.8"
rand_pcg = "0.3"
# FFT for prin-metrics power spectral density (pure Rust, no unsafe at the
# public API boundary; added in WP-010 S1 for the PSD rebuild of PRINet 3.0
# `power_spectral_density`).
rustfft = "6.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DLPack C ABI for zero-copy tensor exchange (PyTorch / JAX / CuPy)
dlpack = "0.2.0"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Testing
proptest = "1"
approx = "0.5"
criterion = "0.5"

# GPU compute language (CubeCL) — Phase 0 spike; runtime selected via crate features.
cubecl = { version = "0.10.0", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
