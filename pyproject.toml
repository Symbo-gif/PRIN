[tool.interrogate]
# Documentation Standards §2.2: 100% public symbols (ruff D), ≥95% overall.
fail-under = 95
ignore-init-method = true
ignore-semiprivate = false
ignore-private = false
exclude = ["python/prin/_prin_core.pyi"]
verbose = 1

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv", "target", "parity", "archive and reference from PRINet 3.0"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "python"
ignore_missing_imports = true
