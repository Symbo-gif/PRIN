[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "prin"
version = "0.3.0"
description = "PRIN -- Phase-Resonance Interference Network: oscillatory binding for neural networks (Rust core + Python API)"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Michael Maillet", email = "therealmichaelmaillet@gmail.com"},
    {name = "Damien Davison"},
    {name = "Sacha Davison"},
]
keywords = [
    "oscillatory-binding",
    "neural-networks",
    "kuramoto",
    "phase-dynamics",
    "object-individuation",
    "slot-attention",
    "chimera-states",
    "temporal-binding",
    "rust",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.0",
    "torchvision>=0.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "interrogate>=1.7",
    "bandit[toml]>=1.7",
    "pip-audit>=2.0",
    "maturin>=1.7",
]
mot = [
    "motmetrics>=1.4.0",
]
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.16; sys_platform != 'win32'",
    "onnxruntime-directml>=1.16; sys_platform == 'win32'",
]
parity = [
    # PRINet 3.0.0 is installed from the archived source tree
    # in DOCS/archive and reference from PRINet 3.0/PRINet-3.0.0-main.
]
all = [
    "prin[dev,mot,onnx]",
]

[project.urls]
Homepage = "https://github.com/Symbo-gif/PRIN"
Documentation = "https://prin.readthedocs.io"
Repository = "https://github.com/Symbo-gif/PRIN"
Issues = "https://github.com/Symbo-gif/PRIN/issues"
Changelog = "https://github.com/Symbo-gif/PRIN/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/prin-py/Cargo.toml"
python-source = "python"
module-name = "prin._prin_core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "gpu: tests that require CUDA GPU",
    "slow: tests that take >5s (training convergence, benchmarks)",
    "parity: differential tests against the archived PRINet 3.0.0 source",
]

[tool.coverage.run]
source = ["prin"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "D", "NPY", "RUF"]
ignore = ["S101"]  # assert is fine in tests; enforced per-path below

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]
"benchmarks/**" = ["S", "D"]
"**/_prin_core.pyi" = ["D"]
"tests/test_generate_corpus.py" = ["E402", "I001"]
