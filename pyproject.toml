[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# Distribution name is `prin-core`, not `prin` (Project Plan amendment #46,
# WP038-F4). PyPI's `prin` is owned by an unrelated project whose only two
# releases date from 2015-05-20, so `publish-pypi` could never have uploaded
# under that name and Plan N4 / Versioning Standards §5 were unsatisfiable as
# written. The **import** name is unchanged — `pip install prin-core` then
# `import prin` — which maturin supports for a mixed Rust/Python project
# because `module-name` below names the package independently of the
# distribution. Verified by building `prin_core-1.0.0rc1-cp311-abi3-win_amd64`
# and confirming `prin/__init__.py` + `prin/_prin_core.pyd` land in the wheel.
# Enforced mechanically by tools/wp001_baseline.py::validate_metadata.
name = "prin-core"
version = "1.0.0rc1"
description = "PRIN -- Phase-Resonance Interference Network: oscillatory binding for neural networks (Rust core + Python API)"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    {name = "Michael Maillet", email = "therealmichaelmaillet@gmail.com"},
    {name = "Damien Davison"},
    {name = "Sacha Davison"},
]
keywords = [
    "oscillatory-binding",
    "neural-networks",
    "kuramoto",
    "phase-dynamics",
    "object-individuation",
    "slot-attention",
    "chimera-states",
    "temporal-binding",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.0",
    "torchvision>=0.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "interrogate>=1.7",
    "bandit[toml]>=1.7",
    "pip-audit>=2.0",
    "maturin>=1.7",
    # Notebook execution harness (WP-037): tests/test_notebooks.py runs all four
    # notebooks end-to-end through nbclient, which is the evidence for Definition
    # of Done #8. In `dev` rather than a separate extra so `pip-audit .` and the
    # Snyk CI job (both resolve `--extra dev`) keep covering this dependency set.
    "nbformat>=5.11",
    "nbclient>=0.11",
    "ipykernel>=7.0",
]
mot = [
    "motmetrics>=1.4.0",
]
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.16; sys_platform != 'win32'",
    "onnxruntime-directml>=1.16; sys_platform == 'win32'",
]
parity = [
    # PRINet 3.0.0 is installed from the archived source tree
    # in DOCS/archive and reference from PRINet 3.0/PRINet-3.0.0-main.
]
devtools = [
    # Local codebase visualization + runtime-observability MCP subsystem
    # (tools/code-intelligence/). See
    # DOCS/devtools/visualization-mcp-plan.md. A well-isolated add-on: no
    # existing PRIN functionality depends on this extra.
    "mcp>=1.9,<2.0",
    "networkx>=3.3,<4.0",
    "pyyaml>=6.0,<7.0",
    "pathspec>=0.12,<2.0",
]
devtools-extra = [
    # Optional accelerators for tools/code-intelligence/: a tree-sitter
    # parsing backend and an OpenTelemetry bridge. Neither is required —
    # the subsystem's regex/AST adapters and local JSONL telemetry
    # exporter work fully without them; this extra exists only to make an
    # explicit, pinned upgrade path available.
    "tree-sitter>=0.23,<1.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
]
all = [
    # Self-reference must use the *distribution* name. Left as `prin[...]`
    # after the amendment-#46 rename, `pip install prin-core[all]` would
    # resolve `prin` from PyPI and install the unrelated 2015 project of that
    # name. Enforced by tools/wp001_baseline.py::validate_metadata.
    "prin-core[dev,mot,onnx]",
]

[project.urls]
Homepage = "https://github.com/Symbo-gif/PRIN"
Documentation = "https://prin.readthedocs.io"
Repository = "https://github.com/Symbo-gif/PRIN"
Issues = "https://github.com/Symbo-gif/PRIN/issues"
Changelog = "https://github.com/Symbo-gif/PRIN/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/prin-py/Cargo.toml"
python-source = "python"
module-name = "prin._prin_core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "gpu: tests that require CUDA GPU",
    "directml: tests that require a DirectML-capable device (skip cleanly on incapable hosts via tests/_env.py::directml_executes; run on PRIN-GPU-Runner)",
    "slow: tests that take >5s (training convergence, benchmarks)",
    "parity: differential tests against the archived PRINet 3.0.0 source",
]

[tool.coverage.run]
source = ["prin"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "D", "NPY", "RUF"]
ignore = ["S101"]  # assert is fine in tests; enforced per-path below

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]
"benchmarks/**" = ["S", "D"]
"**/_prin_core.pyi" = ["D"]
