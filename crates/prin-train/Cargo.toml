[package]
name = "prin-train"
description = "PRIN trainable components: resonance layers, DiscreteDeltaThetaGamma, inhibition/STE, activations, HEP trainer, resonance-aware optimizers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/prin-train"

# docs.rs build configuration; `strict-checks` is pure Rust. See
# `crates/prin-dynamics/Cargo.toml` for when these links resolve.
[package.metadata.docs.rs]
all-features = true

[features]
# Numerical guard validation returns typed errors instead of silently
# repairing out-of-range/non-finite values (Coding Standards §2.2).
strict-checks = []

[dependencies]
prin-dynamics.workspace = true
prin-metrics.workspace = true
prin-kernels.workspace = true
burn.workspace = true
ndarray.workspace = true
num-complex.workspace = true
rayon.workspace = true
rand.workspace = true
rand_pcg.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "resonance_layer_bridge"
harness = false

[[bench]]
name = "phase_tracker_bridge"
harness = false
