[package]
name = "prin-dynamics"
description = "PRIN oscillator models, state, integrators, PAC, coupling topologies, hierarchical band networks, temporal propagation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/prin-dynamics"

# docs.rs build configuration. `strict-checks` is this crate's only feature and
# is pure Rust, so an all-features build is what a reader should see: it
# documents the guarded clamp/finite paths alongside the default ones.
# These links resolve once `release.yml`'s `publish-crates` job is enabled at
# RC1 (WP-038); until then the authoritative rendered rustdoc is
# `cargo doc --workspace --no-deps` (the `rust.yml` docs job).
[package.metadata.docs.rs]
all-features = true

[dependencies]
ndarray.workspace = true
num-complex.workspace = true
rayon.workspace = true
rand.workspace = true
rand_pcg.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
criterion.workspace = true
serde_json.workspace = true

[features]
default = []
# NaN/Inf guards and clamp assertions at runtime (mirrors PRINet 3.0 guards).
strict-checks = []
