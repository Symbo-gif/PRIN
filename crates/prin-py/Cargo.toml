[package]
name = "prin-py"
description = "PyO3 extension crate exposing the PRIN Rust core to Python (the only crate that links Python)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "_prin_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
prin-dynamics.workspace = true
prin-metrics.workspace = true
prin-tensor.workspace = true
prin-kernels.workspace = true
prin-sim.workspace = true
prin-train.workspace = true
prin-daemon.workspace = true
burn.workspace = true
ndarray.workspace = true
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
numpy = "0.29.0"
dlpack.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
cuda = ["prin-kernels/cuda", "prin-sim/cuda"]
wgpu = ["prin-kernels/wgpu", "prin-sim/wgpu"]
npu = ["prin-daemon/npu"]
