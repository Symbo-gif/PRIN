[package]
name = "prin-sim"
description = "PRIN OscilloSim engine: CSR sparse coupling, chimera detection, pruning, and integration orchestration for large oscillator systems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
prin-dynamics.workspace = true
prin-kernels.workspace = true
prin-metrics.workspace = true
sprs.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
criterion.workspace = true

[features]
default = []
# Forwards to prin-dynamics: NaN/Inf guards and clamp assertions at runtime
# for the Integrator/Dynamics machinery prin-sim builds on (WP016-F6). This
# crate defines no strict-checks-gated code of its own.
strict-checks = ["prin-dynamics/strict-checks"]
# GPU/backend dispatch (WP-021): forwards to prin-kernels' CubeCL backends.
# Enabling any one of these compiles the `gpu` module, which wires
# `prin-kernels` kernel dispatch into the simulation engine (`GpuSparseKuramoto`,
# `GpuMeanFieldEngine`, `GpuBandStepper`).
cpu = ["prin-kernels/cpu"]
cuda = ["prin-kernels/cuda"]
wgpu = ["prin-kernels/wgpu"]

[[bench]]
name = "sweep_bench"
harness = false

[[bench]]
name = "gpu_bench"
harness = false
