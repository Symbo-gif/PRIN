[package]
name = "prin-kernels"
description = "PRIN single-source fused kernels (mean-field RK4, sparse k-NN coupling, PAC, fused discrete step, hierarchical reductions) with CPU SIMD fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/prin-kernels"

# docs.rs build configuration. `cpu` is the only CubeCL backend a docs.rs
# builder can compile — `cuda` and `wgpu` need vendor toolchains the builder
# does not have — so the published docs cover the single-source kernels and
# their CPU reference path. The GPU-only items are `#[cfg]`-gated and appear
# in a local `cargo doc --features cuda` instead. See
# `crates/prin-dynamics/Cargo.toml` for when these links resolve.
[package.metadata.docs.rs]
features = ["cpu"]

[dependencies]
prin-dynamics.workspace = true
ndarray.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true

# CubeCL single-source GPU/CPU compute kernels (Phase 0 spike).
# Runtime selection is gated by the cuda/wgpu features below.
cubecl.workspace = true

# GPU backends are introduced in Phase 3 behind feature flags:
#   cuda -> cubecl-cuda (fallback: cudarc for hand-written kernels)
#   wgpu -> cubecl-wgpu (Vulkan/Metal/DX12)
# Pinned versions decided by the Phase 0 spike (see DOCS/PRIN_Project_Plan.md).

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
criterion.workspace = true

[features]
default = []
cpu = ["cubecl/cpu"]
cuda = ["cubecl/cuda"]
wgpu = ["cubecl/wgpu"]

[[bench]]
name = "mean_field_rk4_bench"
harness = false

[[bench]]
name = "sparse_knn_bench"
harness = false

[[bench]]
name = "discrete_step_bench"
harness = false
