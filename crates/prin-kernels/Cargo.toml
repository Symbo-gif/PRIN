[package]
name = "prin-kernels"
description = "PRIN single-source fused kernels (mean-field RK4, sparse k-NN coupling, PAC, fused discrete step, hierarchical reductions) with CPU SIMD fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
prin-dynamics.workspace = true
ndarray.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true

# CubeCL single-source GPU/CPU compute kernels (Phase 0 spike).
# Runtime selection is gated by the cuda/wgpu features below.
cubecl.workspace = true

# GPU backends are introduced in Phase 3 behind feature flags:
#   cuda -> cubecl-cuda (fallback: cudarc for hand-written kernels)
#   wgpu -> cubecl-wgpu (Vulkan/Metal/DX12)
# Pinned versions decided by the Phase 0 spike (see DOCS/PRIN_Project_Plan.md).

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
criterion.workspace = true

[features]
default = []
cuda = ["cubecl/cuda"]
wgpu = ["cubecl/wgpu"]
