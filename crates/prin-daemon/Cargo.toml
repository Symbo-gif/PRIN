[package]
name = "prin-daemon"
description = "PRIN subconscious controller: state/control buffers, native daemon thread, ONNX inference (ort) with NPU/DirectML/CPU backend detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
arc-swap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

# ONNX Runtime bindings (`ort` crate, DirectML/VitisAI EPs) remain reserved
# behind the `npu` feature. WP-028 S1 recorded the evidence that EP coverage
# lags — `ort` is a 2.0.0-rc pre-release whose downloadable binaries carry
# neither the DirectML nor the VitisAI provider, and the Ryzen AI SDK ships
# VitisAI only as a CPython-tagged wheel — so session creation runs on the
# Python `onnxruntime` path (risk register #4 in DOCS/PRIN_Project_Plan.md).

[dev-dependencies]
proptest.workspace = true
approx.workspace = true
tempfile.workspace = true
criterion.workspace = true

[features]
default = []
npu = []
# Numerical guard validation returns typed errors instead of packing
# non-finite telemetry unchanged (Coding Standards §2.2).
strict-checks = []

[[bench]]
name = "control_buffer"
harness = false
