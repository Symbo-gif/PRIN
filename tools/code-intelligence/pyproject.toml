[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "D", "RUF"]
# S101 (assert): matches the root repository's own pyproject.toml, which
# ignores it repo-wide because internal-invariant asserts are a normal,
# reviewed pattern here, not a bypassed security control.
ignore = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]
"cli.py" = ["D103"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests/fixtures/"]

[tool.bandit]
exclude_dirs = ["tests", ".data", "output"]
