# PRIN policy profile for math-audit-mcp (Executive Mathematical Audit Sessions).
# Derived from the tool's bundled `strict` profile: EMA verdicts feed governance
# findings (D1-D4) with the same evidentiary weight as an Executive Audit finding,
# so inconclusive/erroring required checks must never read as passing evidence.
# See DOCS/standards/Executive_Mathematical_Audit_Governance_and_Methodology.md §3.
policy_name: prin-ema
description: >
  PRIN Executive Mathematical Audit policy: symbolic/formal evidence required
  for high/critical claims, no probabilistic-numeric PASS at any severity,
  tool errors and inconclusive results both escalate rather than defaulting
  to human review, optional runtimes (Lean, Wolfram) disabled pending a
  separate plan amendment.

repository:
  allowed_roots: ["."]
  output_root: "EVIDENCE/math-audit"

limits:
  max_expression_length: 800
  max_expression_depth: 32
  max_graph_nodes: 1000
  max_graph_edges: 4000
  max_tensor_dimension: 16
  max_tensor_elements: 200000
  max_numeric_trials: 500
  max_ode_evaluations: 500000
  max_artifact_bytes: 2000000
  default_timeout_seconds: 15

adapters:
  allowed: ["sympy", "scipy", "mpmath", "z3", "networkx", "lean", "wolfram", "pysat"]
  # enable_lean: true per Project Plan amendment #24 (EMA-001 remediation
  # session, 2026-08-14) -- Lean 4 (bare `lean`, no mathlib dependency) is
  # used for decide-based formal corroboration of GRA-01-LEAN/TEN-01-LEAN
  # (concrete, finite, decidable graph/tensor claims). Wolfram remains
  # disabled: it is used only as informal, out-of-band secondary
  # corroboration for the ode_property claims in this session, never as a
  # policy-gating required check, so it never crosses the "new toolchain
  # dependency" threshold that would need a plan amendment.
  enable_lean: true
  enable_wolfram: false
  # enable_pysat: true, added EMA-004 (M-F7 evidentiary-strength gap
  # remediation). Unlike Lean/Wolfram, PySAT is a version-pinned pip
  # dependency of math-audit-mcp itself (python-sat>=1.8) -- no separate
  # binary install, license, or external toolchain, so it does not cross the
  # "new external toolchain dependency" threshold the Lean/Wolfram note above
  # is guarding against. Used only for graph_regularity_sat claims (a new,
  # additive claim_type -- see GRA-01-SAT in
  # prin-dynamics-graph-topology.json), never as a required check on any
  # existing claim's verdict.
  enable_pysat: true
  enable_subprocess: true

symbolic:
  enable_symbolic_evaluation: true

verdict_rules:
  claim_type_required_checks:
    symbolic_identity: ["verify_identity"]
    ode_property: ["audit_ode"]
    numerical_convergence: ["audit_ode"]
    tensor_contract: ["audit_tensor_contract"]
    graph_topology: ["audit_graph_topology"]
    graph_regularity_sat: ["audit_graph_regularity_sat"]
    z3_invariant: ["check_constraint_model"]
    lean_theorem: ["verify_lean_claim"]
    code_contract: ["check_constraint_model"]
    workflow_safety: ["check_constraint_model"]
  severities_requiring_crosscheck: ["medium", "high", "critical"]
  tool_error_treatment: "fail"
  inconclusive_treatment: "fail"
  allow_probabilistic_numeric_pass: false
  high_severity_requires_symbolic_or_formal: true

evidence:
  retain_raw_logs: true
  redact_secrets: true
  bundle_mode: "complete"
