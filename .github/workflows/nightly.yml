name: nightly

# ETCA-001 finding T-F7: Testing Standards §4 requires the full suite to run
# nightly, and Testing Standards §2 requires the criterion / pytest-benchmark
# regression gates to *fail on a >10% slowdown*. Before this workflow no
# `schedule:`d job existed and no gate ever compared a benchmark against a
# stored baseline. This workflow closes both gaps.
#
# Reference-hardware caveat (PSR-016 §5, rust.yml `bench-smoke` comment):
# GitHub-hosted runners have variable/throttled CPU and are not the Phase 2
# exit-gate reference hardware. The 10% threshold here catches gross
# regressions; it is not a substitute for a measured speedup-ratio
# reproduction on the reference host.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          # NB: do not touch /opt/hostedtoolcache — actions/setup-python's
          # interpreter lives there and the venv shebang points at it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h /
      - name: Build and install (CPU-only torch)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt maturin
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt --index-url https://download.pytorch.org/whl/cpu torch torchvision
          maturin develop -m crates/prin-py/Cargo.toml
          # DV-039: this job runs the *whole* suite, so it needs every extra
          # the merge-gating jobs provision between them — `mot` (motmetrics,
          # exercised by tests/test_notebooks.py[02_clevr_n_binding]) and the
          # Sphinx toolchain (tests/test_acceptance_y4q3.py::TestSphinxDocs),
          # both installed by python.yml's `docs` job but previously missing
          # here. Same constraints file as that job (amendment #45 / G6).
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt -e ".[dev,onnx,mot]"
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt -r DOCS/sphinx/requirements.txt
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt -e "DOCS/archive and reference from PRINet 3.0/PRINet-3.0.0-main"
      - name: Full Python suite (including slow + parity)
        run: python -m pytest tests/ parity/ -v
      - name: Rust workspace tests (strict-checks)
        run: cargo test --workspace --features strict-checks

  bench-regression:
    runs-on: ubuntu-latest
    # DV036-F4: four counterbalanced measurement passes (~21 min each) plus
    # two builds no longer fit the original 90-minute single-pass budget.
    timeout-minutes: 180
    env:
      REFERENCE_SHA: 4590d611f34eae5dfcdadb99b562aacf998d6e94
      RUSTUP_TOOLCHAIN: 1.98.1
      PIP_CONSTRAINT: ${{ github.workspace }}/arms/candidate/ci/docs-constraints.txt
      EVIDENCE_DIR: ${{ github.workspace }}/benchmarks/results/nightly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # DV036-F4: both arms are checked out as equal-length siblings
      # (`arms/reference`, `arms/candidate`) so working directories, target
      # directories, venv paths, and the environment each benchmark process
      # inherits have the same shape. The earlier nested `.nightly-reference`
      # layout gave identical binaries a reproducible one-sided delta.
      - uses: actions/checkout@v4
        with:
          path: arms/candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REFERENCE_SHA }}
          path: arms/reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            arms/candidate -> target
            arms/reference -> target
      - name: Free disk space
        run: |
          # NB: do not touch /opt/hostedtoolcache — actions/setup-python's
          # interpreter lives there and the venv shebang points at it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          sudo apt-get clean || true
      - name: Build matched candidate and reference environments
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git -C arms/candidate rev-parse HEAD > "$EVIDENCE_DIR/candidate-sha.txt"
          git -C arms/reference rev-parse HEAD > "$EVIDENCE_DIR/reference-sha.txt"
          test "$(git -C arms/reference rev-parse HEAD)" = "$REFERENCE_SHA"
          { date -u --iso-8601=seconds; uname -a; lscpu; rustc -Vv; python --version; } > "$EVIDENCE_DIR/host.txt"
          cd arms/candidate
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -c ci/lint-constraints.txt maturin pytest==9.1.1 pytest-benchmark==5.3.0
          .venv/bin/python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
          # DV036-F3: --no-build-isolation editable installs spawn the
          # `maturin` CLI from the PEP 517 hook, so each venv's bin/ must be
          # on PATH while its own editable install runs.
          source .venv/bin/activate
          python -m pip install --no-cache-dir --no-build-isolation -c ci/lint-constraints.txt -e ".[dev,onnx]"
          python -m pip freeze --all --exclude-editable > "$EVIDENCE_DIR/dependencies.txt"
          deactivate
          cd ../reference
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install --no-cache-dir -r "$EVIDENCE_DIR/dependencies.txt"
          python -m pip install --no-cache-dir --no-deps --no-build-isolation -e .
          python -m pip freeze --all --exclude-editable > "$EVIDENCE_DIR/reference-dependencies.txt"
          deactivate
          cmp "$EVIDENCE_DIR/dependencies.txt" "$EVIDENCE_DIR/reference-dependencies.txt"
      # Fixed historical source is remeasured on this runner; cached timings
      # are never used, refreshed, or promoted after a failed comparison.
      # DV036-F4 (campaign amendment 4): the fixed counterbalanced order
      # reference, candidate, candidate, reference cancels linear host drift
      # that a single reference-first pass reports as a candidate slowdown.
      # Every pass is kept and averaged; none is a retry.
      - name: Measure reference and candidate in counterbalanced order
        run: |
          set -euo pipefail
          measure() (
            local arm="$1" run="$2"
            cd "$GITHUB_WORKSPACE/arms/$arm"
            source .venv/bin/activate
            mkdir "$EVIDENCE_DIR/$run"
            export CRITERION_HOME="$EVIDENCE_DIR/$run/criterion"
            date -u --iso-8601=seconds > "$EVIDENCE_DIR/$run/start.txt"
            cargo bench --locked --workspace \
              --bench control_buffer --bench training_hooks \
              --bench mean_field_rk4_bench --bench sparse_knn_bench \
              --bench discrete_step_bench --bench sweep_bench \
              --bench resonance_layer_bridge --bench phase_tracker_bridge \
              2>&1 | tee "$EVIDENCE_DIR/$run/criterion.log"
            python -m pytest tests/ -m slow -q \
              --benchmark-only --benchmark-json="$EVIDENCE_DIR/$run/pytest-bench.json" \
              2>&1 | tee "$EVIDENCE_DIR/$run/pytest.log"
            date -u --iso-8601=seconds > "$EVIDENCE_DIR/$run/end.txt"
          )
          measure reference reference-1
          measure candidate candidate-1
          measure candidate candidate-2
          measure reference reference-2
      # DV036-F4 (campaign amendment 4): the lock-free/mutex contention
      # group spins N writer threads on this 4-vCPU runner, and identical
      # code varied 0.39x-1.46x between runs. It is still measured, compared,
      # and reported, but gates only on the reference host (EXP-003 E3).
      - name: Compare against baseline (>10% mean regression fails)
        run: |
          set -euo pipefail
          arms/candidate/.venv/bin/python arms/candidate/tools/check_bench_regression.py \
            --reference "$EVIDENCE_DIR/reference-1" "$EVIDENCE_DIR/reference-2" \
            --candidate "$EVIDENCE_DIR/candidate-1" "$EVIDENCE_DIR/candidate-2" \
            --advisory criterion/control_buffer_read_under_contention/ \
            --threshold 0.10 2>&1 | tee "$EVIDENCE_DIR/comparison.txt"
      - name: Preserve benchmark evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
