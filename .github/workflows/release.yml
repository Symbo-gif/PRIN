name: release

# Wheel matrix + sdist, published to PyPI via OIDC trusted publishing;
# Rust crates published to crates.io.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64
            runner: [self-hosted, Windows, X64]
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            runner: ubuntu-latest
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2014"
            runner: ubuntu-latest
          - os: macos-latest
            target: universal2-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/prin-py/Cargo.toml --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - name: Wheel smoke test
        if: matrix.target != 'aarch64'
        run: |
          python -m pip install dist/*.whl
          python -c "import prin; print(prin.core_version())"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m crates/prin-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crates:
    needs: [wheels]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates to crates.io in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Leaf crate first (no intra-workspace deps)
          cargo publish -p prin-dynamics --no-verify
          # Second tier (depend on prin-dynamics only)
          cargo publish -p prin-metrics --no-verify
          cargo publish -p prin-tensor --no-verify
          cargo publish -p prin-kernels --no-verify
          cargo publish -p prin-daemon --no-verify
          # Third tier (depend on multiple crates)
          cargo publish -p prin-sim --no-verify
          cargo publish -p prin-train --no-verify
          # prin-py has publish=false (Python extension, not a library crate)
