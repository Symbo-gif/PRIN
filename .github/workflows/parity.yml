name: parity

# Differential testing against the archived PRINet 3.0.0 source on the
# golden-trajectory corpus plus hypothesis-generated random cases
# (project plan §7.3).
#
# Runs the exhaustive 504-case differential parity suite using pytest-xdist
# for parallel execution (Phase 1 recommendation R8).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "python/**"
      - "parity/**"

jobs:
  detect_corpus:
    runs-on: ubuntu-latest
    outputs:
      has_cases: ${{ steps.detect.outputs.has_cases }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "has_cases=${{ hashFiles('parity/**/*.py') != '' }}" >> "$GITHUB_OUTPUT"

  parity:
    needs: detect_corpus
    if: needs.detect_corpus.outputs.has_cases == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install new build + reference PRINet 3.0.0 in one venv
        run: |
          pip install --no-cache-dir maturin
          maturin develop -m crates/prin-py/Cargo.toml
          pip install --no-cache-dir -e ".[dev]"
          pip install --no-cache-dir pytest-xdist
          pip install --no-cache-dir -e "DOCS/archive and reference from PRINet 3.0/PRINet-3.0.0-main"
      - name: Run exhaustive differential parity suite (504 cases)
        run: python -m pytest parity/ -v -m parity -n auto
