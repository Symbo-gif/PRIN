name: repro

# Reproducibility pipeline check: figures/tables regenerate from stored JSON
# artefacts and the SHA-256 manifest matches (requirement F4).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/repro.yml"
      - "tools/**"
      - "tests/test_reproduce.py"
      - "python/prin/reporting/**"
      - "paper/**"


jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ETCA-001 T-F5 / DV-022: reclaim disk and install a CPU-only torch
      # before `maturin develop` so `torch>=2.0` does not pull the ~5 GB CUDA
      # 13 wheel stack from PyPI and exhaust the ubuntu-latest disk.
      - name: Free disk space
        run: |
          # NB: do not touch /opt/hostedtoolcache — actions/setup-python's
          # interpreter lives there and the venv shebang points at it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h /
      - name: Build and install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          python -m pip install maturin
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          maturin develop -m crates/prin-py/Cargo.toml
          python -m pip install -e ".[dev]"
      - name: Test reproduction integrity and tamper handling
        run: python -m pytest tests/test_reproduce.py -q
      - name: Regenerate figures and tables, verify manifest
        run: python tools/reproduce.py --verify-manifest
