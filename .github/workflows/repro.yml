name: repro

# Reproducibility pipeline check: figures/tables regenerate from stored JSON
# artefacts and the SHA-256 manifest matches (requirement F4).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "tools/**"
      - "python/prin/reporting/**"
      - "paper/**"


env:
  PRIN_REPRO_ENABLED: "false"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pre-WP-035 guard
        if: env.PRIN_REPRO_ENABLED != 'true'
        run: echo "Reproducibility execution remains guarded until WP-035."
      - name: Build and install
        if: env.PRIN_REPRO_ENABLED == 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          python -m pip install maturin
          maturin develop -m crates/prin-py/Cargo.toml
          python -m pip install -e ".[dev]"
      - name: Regenerate figures and tables, verify manifest
        if: env.PRIN_REPRO_ENABLED == 'true'
        run: python tools/reproduce.py --verify-manifest
