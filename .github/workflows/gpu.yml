name: gpu

# GPU validation on a self-hosted GPU runner (Project Plan amendment #26,
# confirming the self-hosted strategy for DV-001/DV-002).
#
# ETCA-002 findings T-F1 / T-F6 / governance G4 + Project Plan amendment #45:
# this workflow used to be opt-in via a `[gpu]` tag in the commit message, so
# the GPU path was skipped on exactly the pushes that forgot the tag — which
# empirically included `adbb1e3`, the push that closed WP-036E (GPU
# device-resident execution) and WP-036F (DirectML controller-graph
# execution). It now runs unconditionally on every `main` push and on a
# nightly schedule. The self-hosted runner is idle otherwise, so there is no
# cost argument for opt-in.
#
# Requires a GitHub Actions self-hosted runner registered with the
# `[self-hosted, gpu]` labels (GitHub Settings -> Actions -> Runners).
# `PRIN-GPU-Runner` (Windows, online, `[self-hosted, Windows, X64, gpu]`)
# has a real CUDA GPU and a DirectML-capable adapter. Closing DV-001's Triton
# comparison additionally requires a Linux runner (Triton has no Windows
# support); the current Windows runner closes DV-002 (wgpu) but not DV-001.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  gpu-cuda:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      # Rust is pre-installed on PRIN-GPU-Runner; dtolnay/rust-toolchain
      # requires WSL bash, unavailable on this self-hosted Windows runner
      # (same DV-024 root cause rust.yml/python.yml already skip this step
      # for, cb5660b — gpu.yml has no hosted-runner leg, so the step is
      # removed outright rather than made conditional).
      - name: Rust kernel-equivalence tests (CUDA)
        run: cargo test --workspace --features cuda
      - name: Create virtual environment
        # No `shell: bash` here (unlike python.yml's copy of this step):
        # gpu.yml runs exclusively on the self-hosted Windows runner, which
        # has no WSL -- `shell: bash` resolves to Windows' WSL-backed
        # bash.exe shim and fails identically to the dtolnay/rust-toolchain
        # issue this workflow already works around. python.yml's own
        # `shell: bash` step never hits this because its Windows leg only
        # ever runs on the GitHub-hosted windows-latest image (which has
        # WSL); this job has no such hosted leg. Default shell on a
        # Windows runner is already PowerShell.
        run: python -m venv .venv
      - name: Build extension with CUDA and install
        # Invoke the venv's own python.exe by absolute path rather than
        # relying on `$GITHUB_PATH` PATH-prepending: on this self-hosted
        # runner a bare `python`/`pip` still resolved to the shared global
        # Miniforge install (`pip install maturin` reported "already
        # satisfied ... in C:\Users\there\miniforge3\Lib\site-packages")
        # even after the PATH-prepend step, which is how DV-029's original
        # "Python GPU tests" failure picked up that environment's unrelated
        # extra plugins (pytest-xdist/anyio/asyncio/timeout, an
        # unregistered "hypothesis profile 'ci'") instead of this project's
        # own isolated `.venv`. maturin also targets whatever interpreter
        # invokes it, so running it via `.venv\Scripts\python.exe -m
        # maturin` (rather than the bare `maturin` executable) keeps it
        # pinned to the same venv.
        run: |
          .venv\Scripts\python.exe -m pip install --no-cache-dir maturin
          .venv\Scripts\python.exe -m maturin develop -m crates/prin-py/Cargo.toml --features cuda
          .venv\Scripts\python.exe -m pip install --no-cache-dir -e ".[dev,onnx]"
      - name: Python GPU + DirectML tests
        # WP-036D (0144I3) + WP-036E (0144Q3): 12 tests carry @pytest.mark.gpu
        # (7 ported acceptance + 5 export zero-copy). ETCA-002 T-F3/T-F6: the
        # DirectML acceptance tests carry @pytest.mark.directml and run here on
        # PRIN-GPU-Runner's real DirectML adapter (they skip cleanly on hosts
        # without one via tests/_env.py::directml_executes). -m "gpu or directml"
        # selects both. test_sparse_vram_subquadratic is @pytest.mark.skip'd to
        # DV-030. On a CPU-only host the reference skipif guards fire.
        # `-rs` prints skip reasons for visibility.
        run: |
          .venv\Scripts\python.exe -m pytest tests/ -v -m "gpu or directml" -rs --basetemp=.pytest_basetemp
      - name: Kernel performance regression gates
        # `cargo bench --workspace -- <criterion-args>` forwards those args
        # to *every* bench-profile binary it builds, including each crate's
        # own implicit lib target (Cargo defaults `bench = true` on `[lib]`
        # unless a crate opts out) -- not just the `[[bench]]`-declared
        # criterion targets. prin-daemon's plain `#[cfg(test)]` unit tests
        # (compiled as `Running unittests src\lib.rs`) don't understand
        # criterion's `--save-baseline`, so the whole invocation failed
        # before any real bench ever ran -- this gate had never once
        # succeeded in gpu.yml's history prior to this fix. Listing every
        # `[[bench]]` target explicitly (`--bench <name>`, one per crate's
        # Cargo.toml declaration) restricts the run to real criterion
        # benches only, verified locally against this exact command shape.
        run: cargo bench --workspace --features cuda --bench control_buffer --bench training_hooks --bench mean_field_rk4_bench --bench sparse_knn_bench --bench discrete_step_bench --bench sweep_bench --bench gpu_bench --bench resonance_layer_bridge --bench phase_tracker_bridge -- --save-baseline ci

  gpu-wgpu:
    # Closes DV-002: wgpu kernel-equivalence tests deferred from the default
    # CI matrix (amendment #12) to this self-hosted GPU runner.
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Rust kernel-equivalence tests (wgpu)
        run: cargo test --workspace --features wgpu -- --test-threads=1
