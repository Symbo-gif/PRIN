name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy "interrogate>=1.7" "bandit[toml]>=1.7"
      - run: ruff check python/ tests/ benchmarks/ tools/
      - run: ruff format --check python/ tests/ benchmarks/ tools/
      - run: mypy python/prin --strict
      - name: Docstring coverage gate (>=95% overall; public API at 100% via ruff D)
        run: interrogate -c pyproject.toml python/prin
      - name: Security SAST (bandit)
        run: bandit -r python/prin -c pyproject.toml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build extension and install
        run: |
          pip install maturin
          maturin develop -m crates/prin-py/Cargo.toml
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v -m "not slow and not gpu" --cov=prin --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r DOCS/sphinx/requirements.txt || true
