name: python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ETCA-002 T-F2 / T-F10 / G6: pinned, deterministic toolchain. Every tool
      # version is pinned in ci/lint-constraints.txt and kept in step with the
      # maintainer .venv so the local gate == this CI gate. torch is installed
      # from the CPU index first (no CUDA stack) and is needed only so
      # `mypy --strict` can follow `import torch`.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu -c ci/lint-constraints.txt torch
      - run: pip install -c ci/lint-constraints.txt ruff mypy interrogate "bandit[toml]" hypothesis
      - run: ruff check python/ tests/ benchmarks/ tools/
      - run: ruff format --check python/ tests/ benchmarks/ tools/
      - run: mypy python/prin --strict
      - name: Docstring coverage gate (>=95% overall; public API at 100% via ruff D)
        run: interrogate -c pyproject.toml python/prin
      - name: Security SAST (bandit)
        run: bandit -r python/prin -c pyproject.toml

  # ETCA-001 T-F1: the R17 deviation-ledger and R34 DV-register gates ran as
  # the last two steps of the `lint` job, so any earlier lint-step failure
  # (e.g. `bandit` exiting non-zero) left them permanently unreached. They are
  # now their own job with a minimal checkout+python setup so they always run
  # regardless of the state of ruff/mypy/interrogate/bandit.
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deviation-ledger consistency (R17, EA-004 E-F2 enforcement)
        shell: bash
        run: |
          mapfile -t reports < <(ls DOCS/reports/*-project-state.md | sort)
          count=${#reports[@]}
          if [ "$count" -ge 2 ]; then
            prev="${reports[$((count-2))]}"
            curr="${reports[$((count-1))]}"
            prev_num=$(basename "$prev" | grep -oE '^[0-9]+')
            # PSR-020 -> PSR-021 is a known, documented, one-time retroactive
            # correction (EA-004 E-F2: PSR-020 introduced fabricated commit
            # hashes/descriptions for WP015-F6, WP016-F1..F7, WP017-F1..F5;
            # PSR-021 restores the verified content without rewriting
            # PSR-020's own historical table, which still carries the
            # fabricated hashes on disk as the historical record). Skip
            # PSR-020 entirely in this transitional window and validate only
            # the corrected PSR-021; full enforcement (hash + drift) resumes
            # at PSR-022 onward.
            if [ "$prev_num" = "020" ]; then
              python tools/check_deviation_ledger.py "$curr"
            else
              python tools/check_deviation_ledger.py "$prev" "$curr"
            fi
          elif [ "$count" -eq 1 ]; then
            python tools/check_deviation_ledger.py "${reports[0]}"
          fi
      - name: DV-register gate enforcement (R34, EA-006 E-F2 remediation)
        run: python tools/check_dv_register_gates.py
      - name: skipif-guard executability gate (ETCA-002 T-F3 / G8)
        run: python tools/check_skipif_probes.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: windows-latest
            # DV-024 RESOLVED: self-hosted PRIN-GPU-Runner is back online
            # (2026-08-25). However, setup-python cannot install multiple
            # Python versions on the self-hosted runner (registry permissions).
            # Windows Python tests stay on GitHub-hosted windows-latest;
            # Rust tests use the self-hosted runner (rust.yml).
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      # ETCA-001 T-F5 / DV-022: the GitHub-hosted ubuntu-latest image ships
      # ~14 GB free; `torch>=2.0` from PyPI now drags the full CUDA 13 stack
      # (cuda-toolkit, nvidia-*-cu13, triton — ~5 GB) as hard deps, exhausting
      # the disk during `maturin develop`. Reclaim space and install a genuine
      # CPU-only torch *before* the build so nothing re-resolves it.
      - name: Free disk space (Linux hosted runner)
        if: runner.os == 'Linux'
        run: |
          # NB: do not touch /opt/hostedtoolcache — actions/setup-python's
          # interpreter lives there and the venv shebang points at it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h /
      # Linux: install the CPU-only torch BEFORE `maturin develop` so
      # `torch>=2.0` is already satisfied and pip never resolves it from PyPI
      # (which now drags the ~5 GB CUDA 13 wheel stack). Windows keeps the
      # original order — no disk pressure there, and reordering shifted the
      # resolved torch version and flipped a boundary-sensitive gradcheck.
      - name: Build extension and install (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --no-cache-dir maturin
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
          maturin develop -m crates/prin-py/Cargo.toml
          python -m pip install --no-cache-dir -e ".[dev,onnx]"
      - name: Build extension and install (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --no-cache-dir maturin
          maturin develop -m crates/prin-py/Cargo.toml
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install --no-cache-dir -e ".[dev,onnx]"
      - name: Run tests
        run: python -m pytest tests/ -v -m "not slow and not gpu" --cov=prin --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: coverage.xml

  # WP-037 (session `0145`): the documentation gate. Sphinx is built with
  # `-W --keep-going` against a freshly created output directory (Documentation
  # Standards §7 item 3 / AGENTS.md clean-build discipline: an incremental build
  # does not notice an `automodule`-sourced docstring change under an unmodified
  # `.rst`, so a reused directory can mask a real warning). The four notebooks
  # are then executed end-to-end, which is the evidence for Definition of Done
  # #8. Needs the compiled extension because autodoc imports `prin`.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Same disk-pressure mitigation as the `test` job (ETCA-001 T-F5 / DV-022):
      # CPU-only torch installed before `maturin develop` so pip never resolves
      # the ~5 GB CUDA wheel stack. Do not touch /opt/hostedtoolcache.
      - name: Free disk space (Linux hosted runner)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h /
      # WP037-F3: every pip install in this job is bounded by
      # ci/docs-constraints.txt so the merge-gating docs job is deterministic
      # (amendment #45 / G6). Bump the constraints deliberately, in their own
      # commit, and re-run the gate.
      - name: Build extension and install documentation dependencies
        run: |
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt maturin
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt --index-url https://download.pytorch.org/whl/cpu torch torchvision
          maturin develop -m crates/prin-py/Cargo.toml
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt -e ".[dev]"
          python -m pip install --no-cache-dir -c ci/docs-constraints.txt -r DOCS/sphinx/requirements.txt
      - name: Sphinx builds warning-free against a fresh output directory
        run: |
          rm -rf DOCS/sphinx/_build
          python -m sphinx.cmd.build -W --keep-going -b html DOCS/sphinx DOCS/sphinx/_build/html
      - name: Documentation-surface and paper-wiring regression tests
        run: python -m pytest tests/test_sphinx_docs.py tests/test_paper_wiring.py tests/test_notebooks.py -q -m "not slow"
      - name: All four notebooks execute end-to-end (Definition of Done #8)
        run: python -m pytest tests/test_notebooks.py -q -m slow

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install audit tooling
        run: pip install "pip-audit==2.10.1" "uv==0.9.28"
      - name: Audit project dependencies
        run: pip-audit .
      - name: Audit documentation dependencies
        run: pip-audit -r DOCS/sphinx/requirements.txt
      - name: Resolve project dependencies for Snyk
        run: uv pip compile pyproject.toml --extra dev --output-file "${{ runner.temp }}/prin-requirements.txt"
      - name: Install Snyk audit environments
        run: uv pip install --system --requirement "${{ runner.temp }}/prin-requirements.txt" --requirement DOCS/sphinx/requirements.txt
      - name: Snyk project dependency audit
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx --yes snyk@1.1304.2 test --file="${{ runner.temp }}/prin-requirements.txt" --package-manager=pip --severity-threshold=low --fail-on=all
      - name: Snyk documentation dependency audit
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx --yes snyk@1.1304.2 test --file=DOCS/sphinx/requirements.txt --package-manager=pip --severity-threshold=low --fail-on=all
