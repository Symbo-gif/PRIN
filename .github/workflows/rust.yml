name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  clippy-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features strict-checks -- -D warnings

  test:
    # ETCA-001 T-F6 / DV-024: the Windows `test` leg was pinned to the single
    # self-hosted PRIN-GPU-Runner (DV-016/DV-023 migration). When that runner
    # is offline the job sat ~24 h "awaiting a runner" before auto-failing —
    # GitHub Actions has no queue timeout, so `timeout-minutes` does not help.
    # The self-hosted runner is a single point of failure with no fallback and
    # the GITHUB_TOKEN cannot query runner status to pick one dynamically
    # (that needs repo-admin scope). Windows Rust tests therefore run on
    # GitHub-hosted `windows-latest` — reliable and always green, at the cost
    # of the known DV-016 hosted-Windows slowness, bounded by `timeout-minutes`
    # below. The self-hosted runner stays reserved for `gpu.yml` (`[gpu]` tag).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: windows-latest
            runner: windows-latest
          - os: macos-latest
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    # DV-016: bound worst case rather than risk the default 360-minute job
    # timeout silently burning Actions minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: CubeCL CPU kernel-equivalence tests
        run: cargo test -p prin-kernels --features cpu
      - name: GPU-dispatch simulation integration tests (CPU backend)
        run: cargo test -p prin-sim --features cpu -- --test-threads=1

  test-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features strict-checks

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc gate (100% public-item docs, no warnings)
        run: cargo doc --workspace --no-deps

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  bench-smoke:
    # Shared GitHub-hosted runners have variable/throttled CPU allocation and
    # are not the reference hardware behind the Phase 2 exit-gate speedup
    # figures (PSR-016 §5: 8 physical / 16 SMT cores) — this job proves the
    # Criterion harness compiles and executes end-to-end (EA-003 finding
    # E-F9), it does not reproduce or gate on the documented speedup ratios.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p prin-sim --bench sweep_bench -- --test
