name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Default CARGO_BUILD_JOBS for every job: `default` = one job per logical
  # CPU (Cargo's own unset behavior; hosted runners warrant full parallelism).
  # The `test` job overrides this with the matrix value — the self-hosted
  # Windows leg caps at 4, hosted legs re-assert `default`. (The cap cannot
  # use an empty string: modern Cargo rejects `CARGO_BUILD_JOBS=""`.)
  CARGO_BUILD_JOBS: default

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  clippy-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features strict-checks -- -D warnings

  test:
    # ETCA-001 T-F6 / DV-024 (historical): the Windows `test` leg was moved to
    # GitHub-hosted `windows-latest` because the self-hosted `PRIN-GPU-Runner`
    # was only ever run interactively — offline for days at a stretch — and a
    # required job stuck "awaiting a runner" has no queue timeout. That traded
    # DV-024's outage risk for DV-016's hosted-Windows CubeCL-CPU slowness,
    # which regularly runs 80-120 min and — now that `gpu`/`gpu-cuda`/
    # `gpu-wgpu` are required branch-ruleset checks (ETCA-002 T-F7) — twice hit
    # the `timeout-minutes: 120` bound outright on a real PR (etca-002 #8).
    #
    # ETCA-002 remediation fixed DV-024 at the root: `PRIN-GPU-Runner` is now
    # an auto-start Windows **service** (`ci/install-gpu-runner-service.ps1`),
    # not an interactive process, so the outage risk that justified moving off
    # it is gone. It already gates every push as a required check via
    # `gpu.yml`, so routing this leg to it adds no new failure mode — only one
    # more (fast, ~5 min) job in that runner's queue. Only the Windows leg
    # moves; ubuntu/macos stay hosted, where they are fast and reliable.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            self_hosted: false
            cargo_jobs: default
          - os: windows-latest
            runner: windows-latest
            self_hosted: true
            cargo_jobs: "4"
          - os: macos-latest
            runner: macos-latest
            self_hosted: false
            cargo_jobs: default
    # Explicit name so the check-run context stays `test (<os>, <runner>)`
    # regardless of the `self_hosted`/`cargo_jobs` matrix keys — that context
    # string is a required `main` branch-ruleset check (ETCA-002 T-F7);
    # letting the auto-generated name pick up extra keys too would rename the
    # context and permanently block every future PR (the same class of
    # deadlock T-F7 hit with `parity`/`reproduce`'s path filters).
    name: test (${{ matrix.os }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.self_hosted && fromJson('["self-hosted","Windows","gpu"]') || matrix.runner }}
    # DV-016: bound worst case rather than risk the default 360-minute job
    # timeout silently burning Actions minutes. The self-hosted leg finishes
    # in minutes; 120 is purely a safety net for the two hosted legs.
    timeout-minutes: 120
    # PRIN-GPU-Runner is the maintainer's 32 GB workstation; gpu.yml (which
    # gates this same runner) documents that `cargo test --workspace` fans out
    # one rustc per test crate and an unbounded parallel compile burst exhausts
    # RAM (rustc dies STATUS_STACK_BUFFER_OVERRUN / "memory allocation
    # failed"). Apply the same CARGO_BUILD_JOBS=4 cap to this job, scoped to
    # the self-hosted leg via the matrix value; the hosted ubuntu/macos legs
    # re-assert `default` (Cargo's normal one-job-per-logical-CPU behavior),
    # so their parallelism is not reduced.
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain and Swatinem/rust-cache both need WSL bash,
      # unavailable on the self-hosted Windows runner (same DV-024 root cause
      # gpu.yml documents); Rust is already pre-installed there.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.self_hosted }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.self_hosted }}
      - run: cargo test --workspace
      - name: CubeCL CPU kernel-equivalence tests
        run: cargo test -p prin-kernels --features cpu
      - name: GPU-dispatch simulation integration tests (CPU backend)
        run: cargo test -p prin-sim --features cpu -- --test-threads=1

  test-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features strict-checks

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc gate (100% public-item docs, no warnings)
        run: cargo doc --workspace --no-deps

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  bench-smoke:
    # Shared GitHub-hosted runners have variable/throttled CPU allocation and
    # are not the reference hardware behind the Phase 2 exit-gate speedup
    # figures (PSR-016 §5: 8 physical / 16 SMT cores) — this job proves the
    # Criterion harness compiles and executes end-to-end (EA-003 finding
    # E-F9), it does not reproduce or gate on the documented speedup ratios.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p prin-sim --bench sweep_bench -- --test
