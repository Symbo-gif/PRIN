name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  clippy-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features strict-checks -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            self_hosted: false
          - os: windows-latest
            # DV-024 RESOLVED: self-hosted PRIN-GPU-Runner is back online
            # (2026-08-25). Routes Windows to [self-hosted, Windows, X64]
            # to avoid GitHub-hosted windows-latest timeout (DV-016).
            # self_hosted: true — Rust is pre-installed; skip dtolnay/rust-toolchain
            # (requires WSL bash, unavailable on this runner) and rust-cache.
            runner: [self-hosted, Windows, X64]
            self_hosted: true
          - os: macos-latest
            runner: macos-latest
            self_hosted: false
    runs-on: ${{ matrix.runner }}
    # DV-016: bound worst case rather than risk the default 360-minute job
    # timeout silently burning Actions minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.self_hosted }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.self_hosted }}
      - run: cargo test --workspace
      - name: CubeCL CPU kernel-equivalence tests
        run: cargo test -p prin-kernels --features cpu
      - name: GPU-dispatch simulation integration tests (CPU backend)
        run: cargo test -p prin-sim --features cpu -- --test-threads=1

  test-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features strict-checks

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc gate (100% public-item docs, no warnings)
        run: cargo doc --workspace --no-deps

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  bench-smoke:
    # Shared GitHub-hosted runners have variable/throttled CPU allocation and
    # are not the reference hardware behind the Phase 2 exit-gate speedup
    # figures (PSR-016 §5: 8 physical / 16 SMT cores) — this job proves the
    # Criterion harness compiles and executes end-to-end (EA-003 finding
    # E-F9), it does not reproduce or gate on the documented speedup ratios.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p prin-sim --bench sweep_bench -- --test
